<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID layout</title>
    <style>

        
        .container{
          display: grid;
           height: 100vh;
        }

        .box{
            border: 1px solid black;
        }

        @media screen and (max-width:400px){
            .container{
              display: flex;
              flex-direction: column;
            }
        }

        @media screen and (min-width: 401px) and (max-width: 500px){
            .container{
                grid-template-columns: 1fr 1fr;
            }
        }



 
    </style>
</head>
<body>

    <div class="container">
        <div class="box" id="box-1">box1</div>
        <div class="box" id="box-2">box2</div>
        <div class="box" id="box-3">box3</div>
        <div class="box" id="box-4">box4</div>
        <div class="box" id="box-5">box5</div>
        <div class="box" id="box-6">box6</div>
        <div class="box" id="box-7">box7</div>
        <div class="box" id="box-8">box8</div>
        <div class="box" id="box-9">box9</div>
    </div>
    

    
</body>
</html>
